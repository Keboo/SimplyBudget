name: Build and Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'Infra/**'
      - '.github/workflows/deploy-infrastructure.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

defaults:
  run:
    shell: pwsh

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22.x'
  FRONTEND_PROJECT_PATH: 'SimplyBudgetWeb.Web'
  WEB_SOLUTION_PATH: 'SimplyBudgetWeb.slnx'
  BACKEND_PROJECT_PATH: 'SimplyBudgetWeb/SimplyBudgetWeb.csproj'
  UITESTS_PROJECT_PATH: 'SimplyBudgetWeb.UITests/SimplyBudgetWeb.UITests.csproj'
  TERRAFORM_VERSION: '1.14.6'

jobs:
  # Determine whether this run touches anything besides Infra-as-code files.
  # The branch ruleset requires the `build` and `ui-tests` checks on every PR,
  # but GitHub only clears a required check if some job actually reports it -
  # a check that no job ever runs stays "Expected" forever. So both jobs below
  # always run; for Infra-only PRs they just skip their real work (via this
  # job's `app` output) and report success trivially.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect non-Infra changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: 'some-with-excludes'
          filters: |
            app:
              - '**'
              - '!Infra/**'

  # Build and test backend and frontend
  build:
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        if: needs.changes.outputs.app == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          global-json-file: global.json

      - name: Setup pnpm
        if: needs.changes.outputs.app == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        if: needs.changes.outputs.app == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: ${{ env.FRONTEND_PROJECT_PATH }}/pnpm-lock.yaml

      - name: Install frontend dependencies
        if: needs.changes.outputs.app == 'true'
        working-directory: ${{ env.FRONTEND_PROJECT_PATH }}
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        if: needs.changes.outputs.app == 'true'
        working-directory: ${{ env.FRONTEND_PROJECT_PATH }}
        run: pnpm run lint

      - name: Build frontend
        if: needs.changes.outputs.app == 'true'
        working-directory: ${{ env.FRONTEND_PROJECT_PATH }}
        run: pnpm run build
        env:
          BACKEND_URL: ''

      - name: Restore .NET dependencies
        if: needs.changes.outputs.app == 'true'
        run: dotnet restore ${{ env.WEB_SOLUTION_PATH }}

      - name: Build
        if: needs.changes.outputs.app == 'true'
        run: dotnet build ${{ env.WEB_SOLUTION_PATH }} --no-restore --configuration Release

      - name: Restore dotnet tool
        if: needs.changes.outputs.app == 'true'
        run: dotnet tool restore

      - name: Check for Pending Database Changes
        if: needs.changes.outputs.app == 'true'
        run: |
          dotnet ef migrations has-pending-model-changes `
            --configuration Release `
            --project SimplyBudgetWeb.Data/SimplyBudgetWeb.Data.csproj `
           --startup-project SimplyBudgetWeb.AppHost/SimplyBudgetWeb.AppHost.csproj

      # UI tests (SimplyBudgetWeb.UITests) run in their own "ui-tests" job using the
      # Playwright docker image, so this only runs the non-UI test project.
      - name: Test
        if: needs.changes.outputs.app == 'true'
        run: dotnet test --project SimplyBudgetWeb.Core.Tests/SimplyBudgetWeb.Core.Tests.csproj --no-build --configuration Release --verbosity normal
        env:
          DOTNET_BUILD_CONFIGURATION: Release

      - name: Publish
        if: needs.changes.outputs.app == 'true'
        run: dotnet publish ${{ env.BACKEND_PROJECT_PATH }} --configuration Release --no-build

      - name: Build Database Bundle
        if: needs.changes.outputs.app == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          dotnet ef migrations bundle `
            --self-contained `
            --no-build `
            --configuration Release `
            --project SimplyBudgetWeb.Data/SimplyBudgetWeb.Data.csproj `
            --startup-project .\SimplyBudgetWeb.AppHost\SimplyBudgetWeb.AppHost.csproj `
            --output efbundle

      - name: Azure Login
        if: needs.changes.outputs.app == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Upload DB Migration
        if: needs.changes.outputs.app == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: Keboo/sa-upload@v1
        with:
          name: DatabaseMigration
          path: 'efbundle'
          storage-account: keboogithub
          container-name: simplybudget
          create-container: true

      - name: Upload frontend artifact
        if: needs.changes.outputs.app == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: frontend
          path: ${{ env.FRONTEND_PROJECT_PATH }}/dist
          retention-days: 1

  # UI/E2E tests (SimplyBudgetWeb.UITests, Playwright + Aspire). Split into its own
  # job so it runs in parallel with `build` and so it can use the Playwright docker
  # image, which has browsers and their OS dependencies already baked in - avoiding
  # the multi-minute "playwright install --with-deps" download/apt-get step that
  # used to run as part of `build`.
  #
  # This intentionally does NOT use the job-level `container:` feature. GitHub
  # Actions always attaches a `container:`-based job to its own auto-generated
  # bridge network, which conflicts with running that same container in
  # `--network=host` mode ("cannot attach both user-defined and non-user-defined
  # network-modes") - and host networking is required so ports published by
  # sibling containers (e.g. Aspire's SQL Server container) are reachable at
  # "localhost" from inside the test container. Instead, the job runs directly on
  # the runner and manually starts/execs into a detached Playwright container,
  # which gives full control over the `docker run` flags.
  #
  # The test container needs Docker access because the AppHost spins up a SQL
  # Server container via Aspire (which shells out to the `docker` CLI, so it must
  # be installed - the base image doesn't include it). It mounts the runner's
  # Docker socket (docker-outside-of-docker) so sibling containers are created
  # alongside it on the runner's Docker daemon.
  ui-tests:
    runs-on: ubuntu-latest
    needs: changes
    env:
      # Keep this tag in sync with the Microsoft.Playwright version pinned in
      # Directory.Packages.props - the image bakes in matching browsers, so a
      # version mismatch breaks Playwright.
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright/dotnet:v1.62.0-noble
      UI_TESTS_CONTAINER: ui-tests-runner
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Start Playwright container
        if: needs.changes.outputs.app == 'true'
        run: |
          # DOTNET_BUILD_CONFIGURATION must match the --configuration used below to
          # build/test the UITests project: the AppHost's migration helper (see
          # ApplyDatabaseMigrationsAsync in SimplyBudgetWeb.AppHost/Resources.cs) shells
          # out to `dotnet ef database update --no-build`, and without this env var it
          # defaults to "Debug" - which doesn't exist here since only Release is built,
          # so the migration fails and the backend (and then the frontend, which depends
          # on it) never becomes healthy.
          docker run -d --name "$UI_TESTS_CONTAINER" \
            --network host \
            --ipc host \
            --init \
            -e DEBIAN_FRONTEND=noninteractive \
            -e DOTNET_BUILD_CONFIGURATION=Release \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            "$PLAYWRIGHT_IMAGE" \
            tail -f /dev/null

      # The Playwright image doesn't include the Docker CLI; Aspire's orchestrator
      # shells out to `docker` (talking to the socket mounted above) to start the
      # SQL Server container used by the UI tests. Install docker-ce-cli (client
      # only, no daemon needed) from Docker's own apt repo rather than the
      # Ubuntu-archive `docker.io` package, since the base image doesn't enable
      # the `universe` component that `docker.io` lives in.
      - name: Install Docker CLI
        if: needs.changes.outputs.app == 'true'
        run: |
          docker exec "$UI_TESTS_CONTAINER" bash -c '
            set -e
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates curl gnupg
            install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
            chmod a+r /etc/apt/keyrings/docker.asc
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list
            apt-get update
            apt-get install -y --no-install-recommends docker-ce-cli
            rm -rf /var/lib/apt/lists/*
          '

      # The frontend dev server is started by the AppHost as a plain `pnpm dev`
      # process (not a container), so Node.js/pnpm need to be available inside
      # the test container too.
      - name: Install Node.js and pnpm
        if: needs.changes.outputs.app == 'true'
        run: |
          docker exec "$UI_TESTS_CONTAINER" bash -c '
            set -e
            curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
            apt-get install -y --no-install-recommends nodejs
            npm install -g pnpm@10
            rm -rf /var/lib/apt/lists/*
          '

      - name: Restore .NET dependencies
        if: needs.changes.outputs.app == 'true'
        run: docker exec "$UI_TESTS_CONTAINER" dotnet restore "$UITESTS_PROJECT_PATH"

      - name: Build
        if: needs.changes.outputs.app == 'true'
        run: docker exec "$UI_TESTS_CONTAINER" dotnet build "$UITESTS_PROJECT_PATH" --no-restore --configuration Release

      - name: Run UI tests
        if: needs.changes.outputs.app == 'true'
        run: docker exec "$UI_TESTS_CONTAINER" dotnet test --project "$UITESTS_PROJECT_PATH" --no-build --configuration Release --verbosity normal

      - name: Stop Playwright container
        if: always() && needs.changes.outputs.app == 'true'
        run: docker rm -f "$UI_TESTS_CONTAINER" || true

      - name: Upload test failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-failure-screenshots
          path: '**/TestResults/screenshots/*.png'
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-failure-logs
          path: '**/TestResults/logs/*.log'
          if-no-files-found: ignore
          retention-days: 7

  automerge:
    if: ${{ github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' }}
    needs: [build, ui-tests]
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Enable auto-merge for Dependabot PRs
        run: gh pr merge --auto --squash "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  # Get infrastructure outputs from Terraform state
  get-infrastructure-outputs:
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    environment: production
    outputs:
      acr_login_server: ${{ steps.terraform-outputs.outputs.acr_login_server }}
      backend_container_app_name: ${{ steps.terraform-outputs.outputs.backend_container_app_name }}
      backend_url: ${{ steps.terraform-outputs.outputs.backend_url }}
      resource_group_name: ${{ steps.terraform-outputs.outputs.resource_group_name }}
      static_web_app_name: ${{ steps.terraform-outputs.outputs.static_web_app_name }}
      static_web_app_api_key: ${{ steps.terraform-outputs.outputs.static_web_app_api_key }}
      database_connection_string: ${{ steps.terraform-outputs.outputs.database_connection_string }}
      applicationinsights_connection_string: ${{ steps.terraform-outputs.outputs.applicationinsights_connection_string }}
      entra_client_id: ${{ steps.terraform-outputs.outputs.entra_client_id }}
      deploy_ready: ${{ steps.deployment-readiness.outputs.deploy_ready }}
      deploy_readiness_reason: ${{ steps.deployment-readiness.outputs.deploy_readiness_reason }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: Infra
        run: terraform init -lock-timeout=5m
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_USE_OIDC: true

      - name: Get Terraform Outputs
        id: terraform-outputs
        working-directory: Infra
        shell: bash
        run: |
          echo "acr_login_server=$(terraform output -raw acr_login_server)" >> $GITHUB_OUTPUT
          echo "backend_container_app_name=$(terraform output -raw backend_container_app_name)" >> $GITHUB_OUTPUT
          echo "resource_group_name=$(terraform output -raw resource_group_name)" >> $GITHUB_OUTPUT
          echo "static_web_app_name=$(terraform output -raw static_web_app_name)" >> $GITHUB_OUTPUT
          echo "static_web_app_api_key=$(terraform output -raw static_web_app_api_key)" >> $GITHUB_OUTPUT
          echo "backend_url=$(terraform output -raw backend_url)" >> $GITHUB_OUTPUT
          echo "database_connection_string=$(terraform output -raw database_connection_string)" >> $GITHUB_OUTPUT
          echo "applicationinsights_connection_string=$(terraform output -raw applicationinsights_connection_string)" >> $GITHUB_OUTPUT
          echo "entra_client_id=$(terraform output -raw entra_client_id)" >> $GITHUB_OUTPUT
          # entra_tenant_id is intentionally not surfaced as a job output: it is
          # always identical to secrets.ARM_TENANT_ID (this is a single Entra
          # tenant, and azurerm_client_config.current reflects whichever tenant
          # Terraform authenticated with above), so GitHub Actions unconditionally
          # drops it - along with any transformation of it, including base64 -
          # as a "job output" because it matches a registered secret value.
          # Downstream jobs use secrets.ARM_TENANT_ID directly instead.
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_USE_OIDC: true

      - name: Check Deployment Readiness
        id: deployment-readiness
        run: |
          $deployReady = $true
          $reasons = @()

          $resourceGroupName = '${{ steps.terraform-outputs.outputs.resource_group_name }}'
          $backendContainerAppName = '${{ steps.terraform-outputs.outputs.backend_container_app_name }}'
          $staticWebAppApiKey = '${{ steps.terraform-outputs.outputs.static_web_app_api_key }}'

          if ([string]::IsNullOrWhiteSpace($resourceGroupName)) {
            $deployReady = $false
            $reasons += 'Terraform output resource_group_name is empty'
          }

          if ([string]::IsNullOrWhiteSpace($backendContainerAppName)) {
            $deployReady = $false
            $reasons += 'Terraform output backend_container_app_name is empty'
          } else {
            az containerapp show `
              --name $backendContainerAppName `
              --resource-group $resourceGroupName `
              --query name `
              -o tsv `
              --only-show-errors 2>$null | Out-Null

            if ($LASTEXITCODE -ne 0) {
              $deployReady = $false
              $reasons += "Container App '$backendContainerAppName' was not found in resource group '$resourceGroupName'"
              $LASTEXITCODE = 0
            }
          }

          if ([string]::IsNullOrWhiteSpace($staticWebAppApiKey)) {
            $deployReady = $false
            $reasons += 'Terraform output static_web_app_api_key is empty'
          }

          $deployReadinessReason = if ($reasons.Count -eq 0) { 'All deployment prerequisites are available' } else { $reasons -join '; ' }

          "deploy_ready=$($deployReady.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "deploy_readiness_reason=$deployReadinessReason" >> $env:GITHUB_OUTPUT

          if (-not $deployReady) {
            Write-Warning "Skipping deploy jobs because prerequisites are not ready: $deployReadinessReason"
          }
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_USE_OIDC: true

  deploy-database:
    runs-on: ubuntu-latest
    needs: [build, ui-tests, get-infrastructure-outputs]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.get-infrastructure-outputs.outputs.deploy_ready == 'true'
    environment: production

    steps:
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Download DB Migration Bundle
        uses: Keboo/sa-download@v1
        with:
          name: DatabaseMigration
          storage-account: keboogithub
          container-name: simplybudget

      - name: Apply Migration
        run: |
          chmod +x efbundle
          $env:ConnectionStrings__Database = '${{ needs.get-infrastructure-outputs.outputs.database_connection_string }}'
          ./efbundle
          $exitCode = $LASTEXITCODE
          rm efbundle
          exit $exitCode


  # Build and push Docker image for backend
  deploy-backend:
    runs-on: ubuntu-latest
    needs: [build, ui-tests, get-infrastructure-outputs]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.get-infrastructure-outputs.outputs.deploy_ready == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ${{ needs.get-infrastructure-outputs.outputs.acr_login_server }}

      - name: dotnet publish
        run: dotnet publish ${{ env.BACKEND_PROJECT_PATH }} -r linux-x64 --self-contained -t:PublishContainer -p:ContainerRegistry=${{ needs.get-infrastructure-outputs.outputs.acr_login_server }} -p:ContainerImageTags="${{ github.sha }}"

      - name: Update Container App
        run: |
          az containerapp update `
            --name ${{ needs.get-infrastructure-outputs.outputs.backend_container_app_name }} `
            --resource-group ${{ needs.get-infrastructure-outputs.outputs.resource_group_name }} `
            --image ${{ needs.get-infrastructure-outputs.outputs.acr_login_server }}/simplybudgetweb:${{ github.sha }}

  # Deploy frontend to Azure Static Web Apps
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [build, ui-tests, get-infrastructure-outputs]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.get-infrastructure-outputs.outputs.deploy_ready == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: ${{ env.FRONTEND_PROJECT_PATH }}/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_PROJECT_PATH }}
        run: pnpm install --frozen-lockfile

      - name: Build frontend for production
        working-directory: ${{ env.FRONTEND_PROJECT_PATH }}
        run: pnpm run build
        env:
          BACKEND_URL: ${{ needs.get-infrastructure-outputs.outputs.backend_url }}
          # BACKEND_URL: 'TODO' # This should be set to the backend_url, if you use the generated ACA endpoint you may run into issues with cross origin issues.
          APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ needs.get-infrastructure-outputs.outputs.applicationinsights_connection_string }}
          ENTRA_CLIENT_ID: ${{ needs.get-infrastructure-outputs.outputs.entra_client_id }}
          # entra_tenant_id is always the same Entra tenant that Terraform authenticates
          # with in this workflow (secrets.ARM_TENANT_ID), so it's used directly here
          # rather than round-tripped through a Terraform output: GitHub Actions
          # unconditionally drops any job output - including base64-encoded ones -
          # that matches a registered secret value (see #102).
          ENTRA_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ needs.get-infrastructure-outputs.outputs.static_web_app_api_key }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: '${{ env.FRONTEND_PROJECT_PATH }}/dist'
          skip_app_build: true
          skip_api_build: true
